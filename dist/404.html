<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // SPA redirect for GitHub Pages / static hosting
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;
    // Redirect to root hash route
    window.location.replace(window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1) + '#' + path + search + hash);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
